# Site settings
title: "ClearingStation Ltd."
description: "Expert bookkeeping, tax filing & payroll for Manitoba businesses."
url: "https://www.clearingstation.ca"
baseurl: ""

# Build settings
markdown: kramdown

# Blog posts get pretty URLs; pages keep their .html names (nav links use them)
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:title/

# Exclude old files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.zip"
  - clearingstation.ca-Performance-on-Search-2026-01-29
  - invoice-details.html
  - plumbing_invoice.html
  - view_invoice.html
  - blog/self-employed-tax-tips-manitoba-for-plumbers.html
  - blog/plumbing-invoicing-tool-automated-revenue-insights-autosuggested-line-items.html
  - main.css
  - style.css
  - style2.css
  - stylecomp.css
  - pico.css
  - dashboard.css
  - slick.css
  - slick-theme.css
  - script.js
  - offer.js

