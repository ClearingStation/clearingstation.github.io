# Site settings
title: "ClearingStation Ltd."
description: "Expert bookkeeping, tax filing & payroll for Manitoba businesses."
url: "https://www.clearingstation.ca"
baseurl: ""

lang: en-CA
timezone: America/Winnipeg

# Build settings
markdown: kramdown
# The blog is off for now. To turn it on again:
#   1. Remove "blog/" from the exclude list below.
#   2. Uncomment the plugin and feed lines here, and the jekyll-feed group in the Gemfile.
#   3. Put {% feed_meta %} back in _includes/head.html, under the seo include.
# plugins:
#   - jekyll-feed      # /blog/feed.xml (sitemap.xml is our own template)
# feed:
#   path: blog/feed.xml

# Default author and share image for SEO tags (_includes/seo.html)
author: Jennifer Flaming
author_url: /about.html
share_image: /images/optimized/jennifer.jpg

defaults:
  # Blog posts get pretty URLs; pages keep their .html names (nav links use them)
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
      extra_css: /assets/css/blog.css

# Exclude old files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - "*.zip"
  - blog/            # blog is off for now (index and posts), see the note at "Build settings"
  - clearingstation.ca-Performance-on-Search-2026-01-29
  - invoice-details.html
  - plumbing_invoice.html
  - view_invoice.html
  - blog/self-employed-tax-tips-manitoba-for-plumbers.html
  - blog/plumbing-invoicing-tool-automated-revenue-insights-autosuggested-line-items.html
  # Old home page; local jekyll serve prefers index.htm over index.html.
  # Glob form, because a plain "index.htm" prefix-matches index.html too.
  - "index.ht[m]"
  - worker
# Root CSS/JS stay in the build: the old .htm pages still load them

# Site data (used in includes)
phone: "(204) 381-9308"
phone_raw: "2043819308"
# Who answers the phone and when (call bar, home hero, closing call section)
answer_hours: "Mon&ndash;Fri, 8&ndash;5"
email: "support@clearingstation.ca"
address: "1460 Chevrier Blvd #200<br>Winnipeg, MB R3T 1Y6"
ga_id: "G-F06R6NDCPK"
# Structured address and map position for the LocalBusiness schema
street: "1460 Chevrier Blvd #200"
city: Winnipeg
region: MB
postal_code: R3T 1Y6
geo_lat: 49.8252385
geo_lng: -97.1690497
# Google Business reviews (the "5.0 on Google" lines link here).
google_reviews_url: "https://www.google.com/maps/place/ClearingStation+Ltd.+Bookkeeping+%26+Accounting+Services/@49.8252385,-97.1716246,770m/data=!3m2!1e3!5s0x52ea743dcb763bad:0x616d1bbbdb27681a!4m8!3m7!1s0x47f090c3808364f9:0x8f3ad3383674de4d!8m2!3d49.8252385!4d-97.1690497!9m1!1b1!16s%2Fg%2F11whrtq1xt"
