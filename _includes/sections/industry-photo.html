{% comment %}This industry's photo for the landing page hero. Matched by page url in _data/industries.yml.{% endcomment %}
{% assign ind = site.data.industries | where: "url", page.url | first %}
{% assign base = '/images/industries/' | append: ind.image | relative_url %}
<img class="lp-photo" src="{{ base }}-1200.webp" srcset="{{ base }}-640.webp 640w, {{ base }}-1200.webp 1200w"
     sizes="(max-width: 860px) 100vw, 560px" alt="{{ ind.alt }}" width="1200" height="800">
