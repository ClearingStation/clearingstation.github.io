<!-- Industries grid. Data from _data/industries.yml -->
<section class="section industries-section">
    <div class="container">
        <div class="industries-header">
            <h2>{{ include.title | default: "Industries We Serve" }}</h2>
            <p>{{ include.subtitle | default: "From medical practices to tech startups, we understand the unique financial needs of your industry." }}</p>
        </div>
        <div class="industries-grid">
            {% for ind in site.data.industries %}
            <div class="industry-card">
                <div class="industry-icon">{{ ind.icon }}</div>
                <h4>{{ ind.name }}</h4>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
