{% comment %}Industries as photo cards, one per industry landing page. Data from _data/industries.yml.{% endcomment %}
<div class="card-grid">
    {% for ind in site.data.industries %}
    <a class="industry" href="{{ ind.url | relative_url }}">
        <img src="{{ '/images/industries/' | append: ind.image | append: '-640.webp' | relative_url }}" alt="{{ ind.alt }}" width="640" height="427" loading="lazy">
        <span><strong>{{ ind.name }}</strong>{{ ind.note }}</span>
    </a>
    {% endfor %}
</div>
