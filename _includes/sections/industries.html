<!-- Industries grid. Data from _data/industries.yml -->
<section class="section industries-section">
    <div class="container">
        <div class="industries-header">
            <h2>{{ include.title | default: "Industries We Serve" }}</h2>
            <p>{{ include.subtitle | default: "From startups to established enterprises, we've helped businesses across diverse sectors thrive." }}</p>
        </div>
        <div class="industries-grid">
            {% for ind in site.data.industries %}
            <div class="industry-card">
                <div class="industry-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">{{ ind.icon }}</svg></div>
                <h4>{{ ind.name }}</h4>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
