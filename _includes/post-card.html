{% comment %}One post in a list. Param: post{% endcomment %}
<a class="post-card" href="{{ include.post.url | relative_url }}">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%B %-d, %Y" }}</time>
    <h3>{{ include.post.title }}</h3>
    <p>{{ include.post.description }}</p>
</a>
