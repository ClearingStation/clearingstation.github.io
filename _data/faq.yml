# FAQ items for the plans page
- question: "How will you help optimize my tax situation?"
  answer: "Most accountants simply file what you provide. At ClearingStation, we go further. With over 10 years of experience handling hundreds of corporations, we actively search for missed tax deductions—like business expenses, home office costs, and travel—that haven't been submitted. Our thorough process ensures no deduction is overlooked, helping you consistently reduce your taxable income."

- question: "How do you protect my financial information?"
  answer: "We treat your privacy like it's our own. Your financial data is locked down with military-grade AES-256 encryption, backed by strict internal protocols that ensure zero unauthorized access. From document uploads to tax filings, every step is secured, monitored, and protected."

- question: "What exactly does my bookkeeper do?"
  answer: "Your bookkeeper handles everything: categorizing every transaction, reconciling bank accounts monthly, keeping you audit-ready with proof-documents, tracking payroll and expenses, optimizing tax deductions, delivering clean financial reports on time, and handling all communication with tax authorities."

- question: "I'm behind on my bookkeeping. Can you help?"
  answer: "Yes, absolutely! We quickly assess your situation, recover missing documentation, file or amend overdue taxes (minimizing penalties), and handle all CRA communication. We've helped businesses years behind get current—and stay that way."

- question: "Where are your bookkeepers located?"
  answer: "All ClearingStation bookkeepers are located in Manitoba, Canada, near Winnipeg. Each client's main point of contact is a dedicated, professionally-trained, in-house bookkeeper with years of experience in accounting and finance."

- question: "What if I need to switch from QuickBooks?"
  answer: "If you're transitioning from QuickBooks or any other software, we'll help you migrate your bookkeeping seamlessly and ensure continuity. We use our own secure systems, eliminating the need for additional third-party software."
