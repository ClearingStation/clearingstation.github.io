# FAQ items for the plans page
- question: "What counts as a transaction?"
  answer: "A transaction is any single entry in your bank or credit card statement — deposits, withdrawals, transfers, and payments. We count the total across all accounts."

- question: "What if I go over 100 transactions?"
  answer: "No worries — we'll let you know and adjust your plan accordingly. We never surprise you with hidden fees."

- question: "Can I switch plans later?"
  answer: "Absolutely. You can upgrade or downgrade your plan at any time. We'll prorate the difference."

- question: "Do you handle multiple businesses?"
  answer: "Yes! We work with many clients who own more than one business. We'll set up a custom plan that covers all your entities."

- question: "What software do you use?"
  answer: "We use industry-standard tools including QuickBooks, Xero, and our own proprietary platform. We'll work with whatever your business already uses."

- question: "How do I get started?"
  answer: "Book a free consultation and we'll review your needs, recommend a plan, and have you set up within days."
