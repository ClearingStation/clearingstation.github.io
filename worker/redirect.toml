# Redirect Worker for old URLs. Deploy: npx wrangler deploy -c redirect.toml (see README.md).
name = "clearingstation-redirect"
main = "redirect.js"
compatibility_date = "2026-01-01"

# The whole bare domain, plus one route per old www URL (keep in sync with MOVED and GONE in redirect.js).
# Every other www page goes straight to GitHub Pages.
